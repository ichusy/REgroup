<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REgroup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' text-anchor='middle' fill='white'%3ERE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column of full-width launch rows under a centered wordmark */
  :root {
    --bg: #07070f;
    --card: rgba(24, 26, 38, .72);
    --card-hover: rgba(38, 41, 60, .88);
    --border: #2a2d3b;
    --text: #f1f2f8;
    --muted: #8c90a6;
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --danger: #ff5c7a;
    --gold: #ffd166;
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: Figtree, system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    margin: 0;
  }
  #space { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .wrap {
    position: relative;
    max-width: 640px; margin: 0 auto;
    padding-block: 32px 60px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { text-align: center; margin-bottom: 32px; }
  .logo { display: inline-flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
  }
  .logo-mark svg { width: 30px; height: 30px; }
  .logo-text { font-family: var(--font-display); font-size: 42px; font-weight: 800; letter-spacing: -1px; }
  .logo-text b {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); margin-top: 6px; font-size: 14px; }

  .status { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 1 1 150px; min-width: 0; }
  .bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  .status.complete .progress { color: var(--gold); }
  .status.complete .bar i { background: var(--gold); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: none; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent2); outline-offset: -2px; }

  body.in-system { overflow: hidden; }
  body.in-system .wrap { padding-block-end: 0; }
  #system { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .planet {
    position: absolute; top: 0; left: 0; border-radius: 50%; pointer-events: auto;
    text-decoration: none; color: var(--text); will-change: transform;
  }
  .planet span {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px;
    font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted);
    text-shadow: 0 1px 4px var(--bg), 0 0 10px var(--bg);
    transition: color .15s;
  }
  .planet.played span { color: var(--text); }
  .planet.played span::before { content: "✓ "; color: var(--gold); }
  .planet:hover span, .planet:focus-visible span { color: var(--text); font-size: 15px; }
  .planet:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  @media (max-width: 600px) { .planet span { font-size: 11.5px; } .planet:hover span, .planet:focus-visible span { font-size: 13px; } }
  #flash { position: fixed; inset: 0; background: var(--text); opacity: 0; pointer-events: none; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px);
  }
  #toast a { display: block; padding: 12px 18px; color: var(--text); text-decoration: none; }

  #list li { position: relative; }
  #list .check {
    position: absolute; right: 54px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 50%; padding: 0;
    background: transparent; border: 1.5px solid var(--muted); color: var(--bg);
    font: inherit; font-size: 14px; font-weight: 800; line-height: 1; cursor: pointer;
  }
  #list .check:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  #list li.played .check { background: var(--gold); border-color: var(--gold); }
  #list li.played .name { color: var(--muted); }
  .btn {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { color: var(--text); border-color: var(--muted); outline: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .site {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; text-decoration: none; color: var(--text);
    transition: background .15s, transform .15s, border-color .15s;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  a.site:hover, a.site:focus-visible { background: var(--card-hover); border-color: var(--accent); transform: translateX(4px); outline: none; }
  .site img, .site .fallback {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; object-fit: contain;
  }
  .site .fallback {
    display: grid; place-items: center; font-weight: 800; font-family: var(--font-display);
    background: var(--border); color: var(--text);
  }
  .site .name { font-size: 18px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site .arrow { color: var(--muted); font-size: 18px; }

  .editing .site { cursor: grab; }
  .editing .site.dragging { opacity: .4; }
  .editing .site.over { border-color: var(--accent2); }
  .handle { color: var(--muted); font-size: 18px; user-select: none; }
  .move { display: flex; flex-direction: column; }
  .move button, .del { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 4px; font: inherit; }
  .move button { font-size: 12px; line-height: 1.1; }
  .move button:hover { color: var(--text); }
  .del { color: var(--danger); font-size: 20px; }
  .logo-btn { font-size: 12px; padding: 5px 10px; white-space: nowrap; }

  form.add { gap: 8px; margin-top: 14px; flex-wrap: wrap; display: flex; }
  form.add input {
    flex: 1 1 180px; min-width: 0; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px;
  }
  form.add input:focus { outline: none; border-color: var(--accent); }
  .err { color: var(--danger); font-size: 13px; width: 100%; }
  .reset { margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .site { transition: none; } a.site:hover { transform: none; } }
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="wrap" id="app">
  <header>
    <div class="logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <div class="logo-text"><b>RE</b>group</div>
    </div>
    <div class="tagline">Tous tes sites, en un clic.</div>
  </header>

  <div class="status" id="status">
    <div class="progress">
      <span id="progressText"></span>
      <div class="bar"><i id="progressBar"></i></div>
    </div>
    <div class="toolbar">
      <div class="seg" id="viewToggle">
        <button id="viewSystem">Système</button>
        <button id="viewList">Liste</button>
      </div>
      <button class="btn" id="editBtn">Modifier</button>
    </div>
  </div>

  <ul id="list"></ul>

  <form class="add" id="addForm" hidden>
    <input id="addName" placeholder="Nom du site" required>
    <input id="addUrl" placeholder="https://…" required>
    <button class="btn primary" type="submit">Ajouter</button>
    <div class="err" id="addErr" hidden></div>
  </form>
  <div class="reset" id="resetBox" hidden>
    <button class="btn" id="resetBtn">Remettre la liste d'origine</button>
    <span id="resetConfirm" hidden>Sûr ? <button class="btn danger" id="resetYes">Oui, remettre</button> <button class="btn" id="resetNo">Annuler</button></span>
  </div>
</div>
<div id="system" hidden></div>
<div id="flash" aria-hidden="true"></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DEFAULT_SITES = [
  { name: "Wordle",         url: "https://www.nytimes.com/games/wordle/index.html" },
  { name: "Poople",         url: "https://poople.io/" },
  { name: "Minute Cryptic", url: "https://www.minutecryptic.com/" },
  { name: "Worldle",        url: "https://worldle.teuteuf.fr/" },
  { name: "travle",         url: "https://travle.earth/" },
  { name: "Globle",         url: "https://globle-game.com/" },
  { name: "COSTCODLE",      url: "https://costcodle.com/" },
  { name: "Minecraftle",    url: "https://minecraftle.zachmanson.com/" },
  { name: "Connections",    url: "https://www.nytimes.com/games/connections" },
  { name: "Elementle",      url: "https://elementlegame.com/" },
  { name: "Krillion",       url: "https://krillion.io/" },
  { name: "Angle",          url: "https://angle.wtf/" },
  { name: "Quordle",        url: "https://www.merriam-webster.com/games/quordle/#/" },
  { name: "my-shot",        url: "https://my-shot.net/" },
  { name: "STRANDED",       url: "https://stranded.run/" },
  { name: "Flagle",         url: "https://www.flagle.io/" },
  { name: "Farflung",       url: "https://farflung.game/" },
];
const KEY = "regroup-sites";
const SEEN_KEY = "regroup-seen";

let sites = load();
let editing = false;
let dragIndex = null;
let view = "list";

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(saved)) {
      // Append sites added to the default list since this browser last visited,
      // without bringing back ones the viewer deleted
      const seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || DEFAULT_SITES.slice(0, 15).map(s => s.url);
      DEFAULT_SITES.forEach(d => {
        if (!seen.includes(d.url) && !saved.some(s => s.url === d.url)) saved.push(d);
      });
      localStorage.setItem(SEEN_KEY, JSON.stringify(DEFAULT_SITES.map(s => s.url)));
      localStorage.setItem(KEY, JSON.stringify(saved));
      return saved;
    }
  } catch {}
  return DEFAULT_SITES.slice();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(sites)); } catch {}
}

function logoUrl(url) {
  // NYT games share a domain, so point at their own icons
  if (url.includes("nytimes.com/games/wordle")) return "https://www.nytimes.com/games-assets/v2/metadata/wordle-favicon.ico";
  if (url.includes("nytimes.com/games/connections")) return "https://www.nytimes.com/games-assets/v2/metadata/connections-favicon.ico";
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=128`; } catch { return null; }
}

function logoEl(site) {
  const fallback = () => {
    const f = document.createElement("div");
    f.className = "fallback";
    f.textContent = site.name.trim()[0]?.toUpperCase() || "?";
    return f;
  };
  const src = site.logo || logoUrl(site.url);
  if (!src) return fallback();
  const img = document.createElement("img");
  img.alt = "";
  img.src = src;
  img.onerror = () => img.replaceWith(fallback());
  return img;
}

// Shrink the chosen image to 64px so it stays small in saved storage
function setLogo(i, file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const s = Math.min(64 / img.width, 64 / img.height);
      const w = img.width * s, h = img.height * s;
      c.getContext("2d").drawImage(img, (64 - w) / 2, (64 - h) / 2, w, h);
      sites[i].logo = c.toDataURL("image/png");
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= sites.length) return;
  [sites[i], sites[j]] = [sites[j], sites[i]];
  save(); render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("app").classList.toggle("editing", editing);
  document.getElementById("editBtn").textContent = editing ? "Terminé" : "Modifier";
  const inSystem = view === "system";
  document.body.classList.toggle("in-system", inSystem);
  list.hidden = inSystem;
  systemEl.hidden = !inSystem;
  document.getElementById("editBtn").hidden = inSystem;
  document.getElementById("viewSystem").setAttribute("aria-pressed", inSystem ? "true" : "false");
  document.getElementById("viewList").setAttribute("aria-pressed", inSystem ? "false" : "true");
  document.getElementById("addForm").hidden = !editing;
  document.getElementById("resetBox").hidden = !editing;

  sites.forEach((site, i) => {
    const li = document.createElement("li");
    const row = document.createElement(editing ? "div" : "a");
    row.className = "site";
    if (!editing) {
      row.href = site.url;
      row.target = "_blank";
      row.rel = "noopener";
      row.onclick = e => launch(e, i, row);
    }
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = site.name;

    if (editing) {
      const mv = document.createElement("div");
      mv.className = "move";
      const up = document.createElement("button");
      up.textContent = "▲"; up.title = "Monter"; up.onclick = () => move(i, -1);
      const down = document.createElement("button");
      down.textContent = "▼"; down.title = "Descendre"; down.onclick = () => move(i, 1);
      mv.append(up, down);
      row.append(mv);
    }
    row.append(logoEl(site), name);

    if (editing) {
      const del = document.createElement("button");
      del.className = "del";
      del.title = "Supprimer";
      del.textContent = "×";
      del.onclick = () => { sites.splice(i, 1); save(); render(); };
      const pick = document.createElement("input");
      pick.type = "file";
      pick.accept = "image/*";
      pick.id = "logo-" + i;
      pick.hidden = true;
      pick.onchange = () => pick.files[0] && setLogo(i, pick.files[0]);
      const logoBtn = document.createElement("button");
      logoBtn.className = "btn logo-btn";
      logoBtn.textContent = "Logo";
      logoBtn.title = "Choisir une image de logo";
      logoBtn.onclick = () => pick.click();
      row.append(pick, logoBtn, del);

      row.draggable = true;
      row.ondragstart = () => { dragIndex = i; row.classList.add("dragging"); };
      row.ondragend = () => row.classList.remove("dragging");
      row.ondragover = e => { e.preventDefault(); row.classList.add("over"); };
      row.ondragleave = () => row.classList.remove("over");
      row.ondrop = e => {
        e.preventDefault();
        if (dragIndex === null || dragIndex === i) return render();
        const [moved] = sites.splice(dragIndex, 1);
        sites.splice(i, 0, moved);
        dragIndex = null;
        save(); render();
      };
    } else {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "↗";
      row.append(arrow);
    }
    li.append(row);
    if (!editing) {
      const check = document.createElement("button");
      check.className = "check";
      check.title = "Marquer comme joué aujourd'hui";
      check.setAttribute("aria-label", `${site.name} : marquer comme joué aujourd'hui`);
      check.onclick = () => setPlayed(site.url, !played.has(site.url));
      li.append(check);
    }
    list.append(li);
  });
  syncPlanets();
  updatePlayedUI();
}

document.getElementById("editBtn").onclick = () => { editing = !editing; render(); };

document.getElementById("addForm").onsubmit = e => {
  e.preventDefault();
  const err = document.getElementById("addErr");
  const name = document.getElementById("addName").value.trim();
  let url = document.getElementById("addUrl").value.trim();
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  try { new URL(url); } catch {
    err.textContent = "Cette adresse n'est pas valide. Exemple : https://wordle.com";
    err.hidden = false;
    return;
  }
  err.hidden = true;
  sites.push({ name, url });
  save(); render();
  e.target.reset();
};

const resetConfirm = document.getElementById("resetConfirm");
document.getElementById("resetBtn").onclick = () => { resetConfirm.hidden = false; };
document.getElementById("resetNo").onclick = () => { resetConfirm.hidden = true; };
document.getElementById("resetYes").onclick = () => {
  resetConfirm.hidden = true;
  sites = DEFAULT_SITES.slice();
  save(); render();
};

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const systemEl = document.getElementById("system");
const flashEl = document.getElementById("flash");
const toastEl = document.getElementById("toast");
const VIEW_KEY = "regroup-view";
const PLAYED_KEY = "regroup-played";
let scene3d = null;
let activeRow = -1;
let played = loadPlayed();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => t * t * (3 - 2 * t);

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function loadPlayed() {
  try {
    const saved = JSON.parse(localStorage.getItem(PLAYED_KEY));
    if (saved && saved.day === today() && Array.isArray(saved.urls)) return new Set(saved.urls);
  } catch {}
  return new Set();
}
function savePlayed() {
  try { localStorage.setItem(PLAYED_KEY, JSON.stringify({ day: today(), urls: [...played] })); } catch {}
}
function setPlayed(url, on) {
  const wasComplete = isComplete();
  if (on) played.add(url); else played.delete(url);
  savePlayed();
  updatePlayedUI();
  if (scene3d && !wasComplete && isComplete()) scene3d.pulse = 1;
}
function playedCount() { return sites.filter(s => played.has(s.url)).length; }
function isComplete() { return sites.length > 0 && playedCount() === sites.length; }

// Updates in place: replacing a link during its own click would cancel the navigation
function updatePlayedUI() {
  const n = playedCount(), total = sites.length;
  document.getElementById("progressText").textContent = isComplete()
    ? `Système complet : ${total} / ${total} aujourd'hui`
    : `${n} / ${total} jeux aujourd'hui`;
  document.getElementById("progressBar").style.width = total ? `${n / total * 100}%` : "0";
  document.getElementById("status").classList.toggle("complete", isComplete());
  [...document.getElementById("list").children].forEach((li, i) => {
    const on = sites[i] && played.has(sites[i].url);
    li.classList.toggle("played", !!on);
    const check = li.querySelector(".check");
    if (check) {
      check.textContent = on ? "✓" : "";
      check.setAttribute("aria-pressed", on ? "true" : "false");
    }
  });
  if (scene3d) scene3d.planets.forEach((p, i) => {
    const on = played.has(sites[i].url);
    if (p.userData.lit !== on) { p.userData.lit = on; p.userData.repaint(); }
    p.userData.link.classList.toggle("played", on);
    p.userData.link.setAttribute("aria-label", `${sites[i].name}${on ? ", déjà joué aujourd'hui" : ""}`);
  });
}

function showToast(site) {
  toastEl.textContent = "";
  const a = document.createElement("a");
  a.href = site.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = `Ouvrir ${site.name} ↗`;
  a.onclick = () => { toastEl.hidden = true; };
  toastEl.append(a);
  toastEl.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { toastEl.hidden = true; }, 8000);
}

// Marks the game as played, then in the system view jumps to its planet before
// following the real link. The link click stays tied to the viewer's own click.
function launch(e, i, link) {
  if (link.dataset.go) { delete link.dataset.go; return; }
  const site = sites[i];
  setPlayed(site.url, true);
  const s = scene3d;
  if (!s || view !== "system" || reducedMotion || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  if (s.warp) return;
  s.warp = { start: performance.now(), planet: i, out: 0 };
  setTimeout(() => {
    link.dataset.go = "1";
    link.click();
    delete link.dataset.go;
    s.warp.out = performance.now();
    // If no tab took over, the browser blocked it, so offer a plain link
    setTimeout(() => {
      if (document.visibilityState === "visible" && document.hasFocus()) showToast(site);
    }, 700);
  }, 620);
}

function planetSprite(site, i) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  let rgb = "124,92,255", logo = null;
  const repaint = () => {
    const lit = sprite.userData.lit;
    const x = c.getContext("2d");
    x.clearRect(0, 0, 256, 256);
    const glow = x.createRadialGradient(128, 128, 78, 128, 128, 128);
    glow.addColorStop(0, `rgba(${rgb},${lit ? 0.95 : 0.14})`);
    glow.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = glow;
    x.fillRect(0, 0, 256, 256);
    const disc = x.createRadialGradient(100, 90, 8, 128, 128, 90);
    disc.addColorStop(0, lit ? `rgb(${rgb})` : `rgba(${rgb},.35)`);
    disc.addColorStop(1, lit ? "#1a1c2c" : "#0c0d15");
    x.beginPath();
    x.arc(128, 128, 88, 0, Math.PI * 2);
    x.fillStyle = "#0c0d15";
    x.fill();
    x.fillStyle = disc;
    x.fill();
    x.lineWidth = lit ? 4 : 2;
    x.strokeStyle = lit ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.22)";
    x.stroke();
    x.globalAlpha = lit ? 1 : 0.82;
    if (logo) {
      x.save();
      x.beginPath();
      x.roundRect(74, 74, 108, 108, 18);
      x.clip();
      x.drawImage(logo, 74, 74, 108, 108);
      x.restore();
    } else {
      x.fillStyle = "#fff";
      x.font = "800 84px 'Bricolage Grotesque', system-ui, sans-serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText(site.name.trim()[0]?.toUpperCase() || "?", 128, 134);
    }
    x.globalAlpha = 1;
    tex.needsUpdate = true;
  };
  sprite.userData.lit = played.has(site.url);
  sprite.userData.repaint = repaint;
  repaint();
  const src = site.logo || logoUrl(site.url);
  if (src) {
    const img = new Image();
    img.onload = () => {
      try {
        const t = document.createElement("canvas");
        t.width = t.height = 8;
        const tx = t.getContext("2d");
        tx.drawImage(img, 0, 0, 8, 8);
        const d = tx.getImageData(0, 0, 8, 8).data;
        let r = 0, g = 0, b = 0, n = 0;
        for (let k = 0; k < d.length; k += 4) {
          if (d[k + 3] < 128) continue;
          r += d[k]; g += d[k + 1]; b += d[k + 2]; n++;
        }
        if (n) rgb = [r, g, b].map(v => Math.round(v / n)).join(",");
      } catch {}
      logo = img;
      repaint();
    };
    // Logo hosts don't allow WebGL to read their images, so planets load them through a CORS proxy
    img.crossOrigin = "anonymous";
    img.src = src.startsWith("data:") ? src : `https://wsrv.nl/?url=${encodeURIComponent(src)}&output=png`;
  }

  // A real link follows each planet, so clicks, focus and screen readers all work
  const link = document.createElement("a");
  link.className = "planet";
  link.href = site.url;
  link.target = "_blank";
  link.rel = "noopener";
  const label = document.createElement("span");
  label.textContent = site.name;
  link.append(label);
  link.onclick = e => launch(e, i, link);
  link.onpointerenter = () => { activeRow = i; };
  link.onpointerleave = () => { activeRow = -1; };
  link.onfocus = () => { activeRow = i; };
  link.onblur = () => { activeRow = -1; };
  sprite.userData.link = link;
  sprite.userData.size = 1;
  return sprite;
}

function softDot(inner, outer) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, outer);
  g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function initScene() {
  if (!window.THREE) return null;
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("space"), antialias: true });
  } catch { return null; }
  renderer.setClearColor(0x07070f);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);

  const STARS = 1800;
  const pos = new Float32Array(STARS * 3);
  for (let i = 0; i < STARS; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 120;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 90;
    pos[i * 3 + 2] = Math.random() * 110 - 80;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 0.32, map: softDot("#ffffff", "rgba(190,205,255,.6)"), transparent: true, depthWrite: false, color: 0xdfe6ff,
  })));

  // Star trails, only drawn during a jump
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(STARS * 6), 3));
  const trails = new THREE.LineSegments(trailGeo, new THREE.LineBasicMaterial({ color: 0xcfe0ff, transparent: true, opacity: 0, depthWrite: false }));
  trails.frustumCulled = false;
  scene.add(trails);

  const orbit = new THREE.Group();
  orbit.rotation.x = 0.9;
  scene.add(orbit);

  const ringPts = [];
  for (let i = 0; i < 128; i++) {
    const t = i / 128 * Math.PI * 2;
    ringPts.push(new THREE.Vector3(Math.cos(t), 0, Math.sin(t)));
  }
  const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
  const rings = [0, 1, 2].map(() => {
    const ring = new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ color: 0x7c5cff, transparent: true, opacity: 0.3 }));
    orbit.add(ring);
    return ring;
  });

  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: softDot("rgba(240,250,255,1)", "rgba(90,130,255,.55)"),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  orbit.add(core);

  const s = {
    renderer, scene, camera, orbit, rings, core, starGeo, trailGeo, trails, planets: [], signature: "",
    rx: 13, rz: 11, size: 3.2, angles: [0, 1.1, 2.3], glow: 0, gold: 0, pulse: 0, warp: null, warpAmt: 0,
    camZ: reducedMotion ? 34 : 60, mx: 0, my: 0, last: performance.now(),
  };

  const resize = () => {
    const w = innerWidth, h = innerHeight, aspect = w / h;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, w < 700 ? 1.5 : 2));
    renderer.setSize(w, h, false);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    s.rx = clamp(aspect * 10.7 * 0.8, 3.9, 15);
    s.rz = aspect < 1 ? 9 : 7.6;
    s.size = aspect < 1 ? 2 : 3.2;
  };
  addEventListener("resize", resize);
  resize();

  if (!reducedMotion) {
    addEventListener("pointermove", e => {
      s.mx = e.clientX / innerWidth - 0.5;
      s.my = e.clientY / innerHeight - 0.5;
    });
  }
  renderer.setAnimationLoop(() => tickScene(s));
  return s;
}

function syncPlanets() {
  if (!scene3d) return;
  const signature = sites.map(p => p.url + (p.logo ? p.logo.length : "")).join("|");
  if (signature === scene3d.signature) return;
  scene3d.signature = signature;
  activeRow = -1;
  scene3d.planets.forEach(p => {
    scene3d.orbit.remove(p);
    p.userData.link.remove();
    p.material.map.dispose();
    p.material.dispose();
  });
  // Three orbits, fuller towards the outside
  const n = sites.length;
  const inner = Math.round(n * 0.24), middle = Math.round(n * 0.35);
  scene3d.layout = sites.map((_, i) => {
    if (i < inner) return { ring: 0, index: i, count: inner };
    if (i < inner + middle) return { ring: 1, index: i - inner, count: middle };
    return { ring: 2, index: i - inner - middle, count: n - inner - middle };
  });
  scene3d.rings[0].visible = inner > 0;
  scene3d.rings[1].visible = middle > 0;
  scene3d.planets = sites.map((site, i) => {
    const p = planetSprite(site, i);
    scene3d.orbit.add(p);
    systemEl.append(p.userData.link);
    return p;
  });
}

const RING_SIZE = [0.42, 0.7, 1];
const RING_SPEED = [0.05, 0.035, 0.024];
const HOME = new THREE.Vector3();
const TARGET = new THREE.Vector3();
const LOOK = new THREE.Vector3();

function tickScene(s) {
  const now = performance.now();
  const dt = Math.min((now - s.last) / 1000, 0.05);
  s.last = now;
  const inSystem = view === "system";
  const active = inSystem ? activeRow : -1;

  // Jump: ramps up until the link opens, then eases away
  if (s.warp) {
    const w = s.warp;
    s.warpAmt = w.out ? 1 - clamp((now - w.out) / 900, 0, 1) : ease(clamp((now - w.start) / 620, 0, 1));
    if (w.out && s.warpAmt === 0) s.warp = null;
  } else {
    s.warpAmt = 0;
  }
  const amt = s.warpAmt;

  if (!reducedMotion && active < 0 && !s.warp) {
    s.angles = s.angles.map((a, k) => a + dt * RING_SPEED[k]);
  }

  // The system brightens as games get played, and turns gold once all are done
  const share = sites.length ? playedCount() / sites.length : 0;
  s.glow += (share - s.glow) * (1 - Math.exp(-dt * 2));
  s.gold += ((isComplete() ? 1 : 0) - s.gold) * (1 - Math.exp(-dt * 2));
  s.pulse = Math.max(0, s.pulse - dt * 0.8);
  s.core.visible = inSystem;
  s.core.scale.setScalar(5 + s.glow * 7 + Math.sin(now / 1400) * 0.25 + s.pulse * 10);
  s.core.material.opacity = 0.55 + s.glow * 0.45;
  s.rings.forEach((r, k) => {
    r.scale.set(s.rx * RING_SIZE[k], 1, s.rz * RING_SIZE[k]);
    if (s.pulse) r.scale.multiplyScalar(1 + (1 - s.pulse) * s.pulse * 0.25);
    r.material.opacity = 0.2 + s.glow * 0.45;
    r.material.color.setRGB(0.49 + 0.51 * s.gold, 0.36 + 0.46 * s.gold, 1 - 0.59 * s.gold);
  });
  s.orbit.visible = inSystem;

  s.planets.forEach((p, i) => {
    const l = s.layout[i];
    const t = s.angles[l.ring] + l.index / l.count * Math.PI * 2;
    const f = RING_SIZE[l.ring];
    p.position.set(Math.cos(t) * s.rx * f, 0, Math.sin(t) * s.rz * f);
    const k = 1 - Math.exp(-dt * 10);
    p.userData.size += ((i === active ? 1.35 : 1) - p.userData.size) * k;
    p.scale.setScalar(s.size * p.userData.size);
    const op = active < 0 || i === active ? 1 : 0.6;
    p.material.opacity += (op - p.material.opacity) * k;
  });
  s.orbit.updateMatrixWorld();

  if (!reducedMotion) {
    const speed = 1 + amt * 170;
    const tail = amt * 16;
    const pos = s.starGeo.attributes.position;
    const trail = s.trailGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let z = pos.getZ(i) + speed * dt;
      if (z > 30) z -= 110;
      pos.setZ(i, z);
      if (amt) {
        trail.setXYZ(i * 2, pos.getX(i), pos.getY(i), z);
        trail.setXYZ(i * 2 + 1, pos.getX(i), pos.getY(i), z - tail);
      }
    }
    pos.needsUpdate = true;
    if (amt) trail.needsUpdate = true;
    s.trails.material.opacity = amt;
  }

  const c = s.camera;
  s.camZ += (34 - s.camZ) * (1 - Math.exp(-dt * 1.8));
  HOME.set(s.mx * 2.4, 1.2 - s.my * 1.6, s.camZ);
  LOOK.set(0, 1.5, 0);
  if (s.warp && s.planets[s.warp.planet]) {
    s.planets[s.warp.planet].getWorldPosition(TARGET);
    c.position.copy(HOME).lerp(TARGET, amt * 0.9);
    LOOK.lerp(TARGET, amt);
  } else {
    c.position.copy(HOME);
  }
  c.lookAt(LOOK);
  const fov = 35 + amt * 45;
  if (c.fov !== fov) { c.fov = fov; c.updateProjectionMatrix(); }
  c.updateMatrixWorld();
  flashEl.style.opacity = amt > 0.75 ? (amt - 0.75) * 3 : 0;

  if (inSystem) {
    const w = innerWidth, h = innerHeight;
    const pxPerUnit = d => h / (2 * d * Math.tan(c.fov * Math.PI / 360));
    s.planets.forEach(p => {
      p.getWorldPosition(TARGET);
      const dist = TARGET.distanceTo(c.position);
      const depth = TARGET.z;
      TARGET.project(c);
      const link = p.userData.link;
      const disc = Math.max(44, p.scale.x * 0.69 * pxPerUnit(dist));
      link.style.width = link.style.height = `${disc}px`;
      link.style.transform = `translate(${(TARGET.x + 1) / 2 * w - disc / 2}px, ${(1 - TARGET.y) / 2 * h - disc / 2}px)`;
      link.style.zIndex = Math.round(depth + 50);
    });
  }
  s.renderer.render(s.scene, c);
}

document.getElementById("viewSystem").onclick = () => setView("system");
document.getElementById("viewList").onclick = () => setView("list");
function setView(v) {
  view = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch {}
  if (v === "system") editing = false;
  activeRow = -1;
  render();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  // A new day may have started while the tab was in the background
  played = loadPlayed();
  updatePlayedUI();
});

scene3d = initScene();
try { view = localStorage.getItem(VIEW_KEY) || "system"; } catch { view = "system"; }
if (!scene3d) {
  view = "list";
  document.getElementById("viewToggle").hidden = true;
}
render();
</script>
</body>
</html>
